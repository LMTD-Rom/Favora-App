name: favora_app
description: "Favora — Aplikasi Kartu Member & Poin Loyalitas"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI & Design
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.16

  # QR Code
  qr_flutter: ^4.1.0

  # State Management & Architecture
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Storage (local)
  shared_preferences: ^2.3.5

  # Utilities
  intl: ^0.20.3
  uuid: ^4.5.1
  smooth_page_indicator: ^1.2.0+3
  flutter_staggered_animations: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^2.6.3
  build_runner: ^2.4.14

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/icons/
